name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine-tests:
    name: Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-engine.txt pytest

      - name: Run tests
        run: pytest -q

      - name: Smoke check CLI
        run: python -m engine.cli --symbol AAPL --no-cache --models drift,holt --wf-splits 8
