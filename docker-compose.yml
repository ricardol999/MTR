services:
  # Motor de análisis y pronóstico (API HTTP en :8000).
  engine:
    build: .
    image: mtr-engine:latest
    restart: unless-stopped
    # Por defecto solo expuesto a localhost del servidor; Caddy lo publica con
    # HTTPS. Para acceso HTTP directo sin Caddy, quita el prefijo "127.0.0.1:".
    # El puerto del host se puede cambiar con ENGINE_HOST_PORT (evita colisiones
    # con otros servicios). El puerto del contenedor es siempre 8000.
    ports:
      - "127.0.0.1:${ENGINE_HOST_PORT:-8000}:8000"
    command: ["python", "-m", "engine.api", "--host", "0.0.0.0", "--port", "8000"]

  # Proxy inverso con HTTPS automático (Let's Encrypt). Solo se levanta con el
  # perfil "tls" y requiere un dominio apuntando a este servidor.
  #   ENGINE_DOMAIN=api.tudominio.com docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on: [engine]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Define ENGINE_DOMAIN al activar el perfil tls, p.ej.:
      #   ENGINE_DOMAIN=api.aduax.us docker compose --profile tls up -d
      ENGINE_DOMAIN: ${ENGINE_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
