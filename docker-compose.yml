services:
  # Motor de análisis y pronóstico (API HTTP en :8000).
  engine:
    build: .
    image: mtr-engine:latest
    restart: unless-stopped
    # Por defecto solo expuesto a localhost del servidor; Caddy lo publica con
    # HTTPS. Si quieres acceso HTTP directo sin Caddy, cambia a "8000:8000".
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "-m", "engine.api", "--host", "0.0.0.0", "--port", "8000"]

  # Proxy inverso con HTTPS automático (Let's Encrypt). Solo se levanta con el
  # perfil "tls" y requiere un dominio apuntando a este servidor.
  #   ENGINE_DOMAIN=api.tudominio.com docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on: [engine]
    ports:
      - "80:80"
      - "443:443"
    environment:
      ENGINE_DOMAIN: ${ENGINE_DOMAIN:?define ENGINE_DOMAIN, p.ej. api.aduax.us}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
